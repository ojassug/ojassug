<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 335" width="100%" height="335">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.1s infinite;
      }
      .code-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Monaco, Menlo, Consolas, monospace;
        font-size: 12.8px;
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="840" height="335" rx="10" fill="url(#termGrad)" stroke="#30363d" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 830 0 C 835.523 0 840 4.477 840 10 L 840 34 L 0 34 Z" fill="#161b22" />
  <line x1="0" y1="34" x2="840" y2="34" stroke="#21262d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="17" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="38" cy="17" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="56" cy="17" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="420" y="22" text-anchor="middle" fill="#8b949e" class="code-text" font-size="11.5" letter-spacing="0.5">ojassug@workstation: ~ (fastfetch)</text>

  <!-- Command Line Prompt -->
  <text x="25" y="62" class="code-text">
    <tspan fill="#7aa2f7" font-weight="600">ojassug@workstation</tspan><tspan fill="#565f89">:</tspan><tspan fill="#bb9af7">~</tspan><tspan fill="#73daca">$</tspan> <tspan fill="#f0f6fc">fastfetch --config profile.jsonc</tspan>
  </text>

  <!-- Arch Linux ASCII Logo (Monospace Left Column) -->
  <text x="38" y="94" fill="#7aa2f7" class="code-text" font-weight="bold">       /\</text>
  <text x="38" y="116" fill="#7aa2f7" class="code-text" font-weight="bold">      /  \</text>
  <text x="38" y="138" fill="#7aa2f7" class="code-text" font-weight="bold">     /\   \</text>
  <text x="38" y="160" fill="#7aa2f7" class="code-text" font-weight="bold">    /      \</text>
  <text x="38" y="182" fill="#7aa2f7" class="code-text" font-weight="bold">   /   ,,   \</text>
  <text x="38" y="204" fill="#7aa2f7" class="code-text" font-weight="bold">  /   |  |  -\</text>
  <text x="38" y="226" fill="#7aa2f7" class="code-text" font-weight="bold"> /_-''    ''-_\</text>

  <!-- Fastfetch Stats Right Column (Aligned Grid) -->
  <!-- User -->
  <text x="205" y="94" fill="#7dcfff" class="code-text" font-weight="600">user</text>
  <text x="270" y="94" fill="#565f89" class="code-text">:</text>
  <text x="285" y="94" fill="#f0f6fc" class="code-text">Ojas Sugur (ojassug)</text>

  <!-- Role -->
  <text x="205" y="116" fill="#7dcfff" class="code-text" font-weight="600">role</text>
  <text x="270" y="116" fill="#565f89" class="code-text">:</text>
  <text x="285" y="116" fill="#c0caf5" class="code-text">Systems &amp; AI Infrastructure Engineer</text>

  <!-- Status -->
  <text x="205" y="138" fill="#7dcfff" class="code-text" font-weight="600">status</text>
  <text x="270" y="138" fill="#565f89" class="code-text">:</text>
  <text x="285" y="138" fill="#9ece6a" class="code-text" font-weight="600">Available for high-impact engineering roles</text>

  <!-- Focus -->
  <text x="205" y="160" fill="#7dcfff" class="code-text" font-weight="600">focus</text>
  <text x="270" y="160" fill="#565f89" class="code-text">:</text>
  <text x="285" y="160" fill="#c0caf5" class="code-text">Distributed Systems <tspan fill="#bb9af7">•</tspan> AI Tooling <tspan fill="#bb9af7">•</tspan> Compilers/AST</text>

  <!-- OS -->
  <text x="205" y="182" fill="#7dcfff" class="code-text" font-weight="600">os</text>
  <text x="270" y="182" fill="#565f89" class="code-text">:</text>
  <text x="285" y="182" fill="#c0caf5" class="code-text">Arch Linux x86_64 / Windows 11 (UCRT64)</text>

  <!-- Runtime -->
  <text x="205" y="204" fill="#7dcfff" class="code-text" font-weight="600">runtime</text>
  <text x="270" y="204" fill="#565f89" class="code-text">:</text>
  <text x="285" y="204" fill="#c0caf5" class="code-text">Node 22 LTS <tspan fill="#bb9af7">•</tspan> Python 3.11+ <tspan fill="#bb9af7">•</tspan> GCC 14 (C++20)</text>

  <!-- Cloud -->
  <text x="205" y="226" fill="#7dcfff" class="code-text" font-weight="600">cloud</text>
  <text x="270" y="226" fill="#565f89" class="code-text">:</text>
  <text x="285" y="226" fill="#c0caf5" class="code-text">AWS (Bedrock, S3, EC2) <tspan fill="#bb9af7">•</tspan> Azure <tspan fill="#bb9af7">•</tspan> Docker</text>

  <!-- DB -->
  <text x="205" y="248" fill="#7dcfff" class="code-text" font-weight="600">db</text>
  <text x="270" y="248" fill="#565f89" class="code-text">:</text>
  <text x="285" y="248" fill="#c0caf5" class="code-text">PostgreSQL <tspan fill="#bb9af7">•</tspan> Oracle SQL <tspan fill="#bb9af7">•</tspan> Redis</text>

  <!-- Uptime -->
  <text x="205" y="270" fill="#7dcfff" class="code-text" font-weight="600">uptime</text>
  <text x="270" y="270" fill="#565f89" class="code-text">:</text>
  <text x="285" y="270" fill="#7aa2f7" class="code-text">100% commit fidelity &amp; zero-drift CI</text>

  <!-- Active Prompt Line with Blinking Cursor -->
  <text x="25" y="306" class="code-text">
    <tspan fill="#7aa2f7" font-weight="600">ojassug@workstation</tspan><tspan fill="#565f89">:</tspan><tspan fill="#bb9af7">~</tspan><tspan fill="#73daca">$</tspan> <tspan fill="#7aa2f7" class="cursor" font-weight="bold">▋</tspan>
  </text>
</svg>
