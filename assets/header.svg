<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0" />
      <stop offset="30%" stop-color="#7aa2f7" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#bb9af7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#7aa2f7" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="200" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.2" />
  
  <!-- Subtle Grid Pattern -->
  <rect width="900" height="200" rx="14" fill="url(#grid)" />

  <!-- Accent Top Glow Line -->
  <path d="M 80 1 L 820 1" stroke="url(#lineGrad)" stroke-width="2" />

  <!-- Terminal Dot Indicators -->
  <circle cx="35" cy="30" r="5" fill="#f7768e" />
  <circle cx="52" cy="30" r="5" fill="#e0af68" />
  <circle cx="69" cy="30" r="5" fill="#9ece6a" />
  <text x="88" y="34" fill="#565f89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="12" font-weight="500">ojassug@workstation:~</text>

  <!-- Main Title -->
  <text x="450" y="105" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="2">OJAS SUGUR</text>

  <!-- Subtitle Tagline -->
  <text x="450" y="142" text-anchor="middle" fill="#c0caf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="15" font-weight="500" letter-spacing="1.5">Systems · Distributed AI Infrastructure · Deterministic Tooling</text>

  <!-- Bottom Accent Tag -->
  <text x="450" y="172" text-anchor="middle" fill="#7aa2f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="12" font-weight="400" letter-spacing="1">[ C++20 • Python • TypeScript • Offline Static AST • Zero-Drift CI ]</text>
</svg>
