<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="150">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <!-- Background Matte Card -->
  <rect width="900" height="150" rx="8" fill="url(#headerBg)" stroke="#21262d" stroke-width="1" />
  
  <!-- Subtle Top Accent Border -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#30363d" stroke-width="1.5" />

  <!-- Name Title: Solid, Crisp White, Professional Non-Vibecoded Typography -->
  <text x="450" y="62" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="1">Ojas Sugur</text>

  <!-- Engineering Subtitle: Clean Slate -->
  <text x="450" y="96" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">Systems &amp; AI Infrastructure Engineer</text>

  <!-- Architecture & Stack Line -->
  <text x="450" y="124" text-anchor="middle" fill="#58a6ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12.5" font-weight="500" letter-spacing="0.5">Distributed Systems • AI Tooling • Compilers/AST • Offline Verification</text>
